name: "Snyk Analysis"

# Snyk enforcement happens at RELEASE time: the shared release-on-tag workflow
# runs the snyk release gate (severity-threshold=high) before creating the
# GitHub Release. This standalone workflow is kept for manual/on-demand scans,
# triggerable from the Actions UI with the input below.
# Thin caller of decaf-ts/reusable-actions/.github/workflows/snyk-analysis.yaml.

on:
  workflow_dispatch:
    inputs:
      args:
        description: "Extra snyk arguments (e.g. --severity-threshold=high). SARIF output is always enabled."
        required: false
        default: ""
      snyk-fail-on:
        description: "When Snyk should fail the scan: all, upgradable, or patchable. Defaults to upgradable."
        type: choice
        options:
          - upgradable
          - all
          - patchable
        required: false
        default: upgradable

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security:
    uses: decaf-ts/reusable-actions/.github/workflows/snyk-analysis.yaml@master
    with:
      args: ${{ inputs.args }}
      snyk-fail-on: ${{ inputs.snyk-fail-on }}
      strict-out-of-sync: false
    secrets: inherit

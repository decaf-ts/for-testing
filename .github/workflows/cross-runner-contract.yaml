name: "Cross-runner contract"

# Runs the shared framework contract spec under jest, vitest and
# @playwright/test. The repository keeps jest as the full-suite runner; this
# job proves the framework seam against every supported runner on each PR.

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: cross-runner-contract-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: contract-deps-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            contract-deps-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install all runners
        run: npm ci

      - name: Build
        run: npm run build:prod

      - name: Contract under jest
        run: npm run test:contract:jest

      - name: Contract under vitest
        run: npm run test:contract:vitest

      - name: Contract under Playwright
        run: npm run test:contract:playwright
